<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SE Navigator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Light Neutral Backgrounds */
  --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --border: #e2e8f0; --border-hi: #cbd5e1;
  
  /* Dark Text for Contrast */
  --text: #0f172a; --muted: #64748b; --dim: #cbd5e1; /* Background dot grid */
  
  /* Accent Colors (Tweaked for white backgrounds) */
  --acc: #2563eb; --green: #16a34a; --amber: #d97706; --red: #dc2626; --purple: #7c3aed; --cyan: #0d9488;
  
  --ph: 52px; --pw: 360px; --r: 5px;
  --f-ui: 'Outfit', sans-serif; --f-mono: 'JetBrains Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-ui)}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(var(--dim) 1px,transparent 1px);background-size:26px 26px;pointer-events:none;z-index:0}

/* ── Topbar ── */
header{position:fixed;top:0;left:0;right:0;height:var(--ph);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:200}
.logo{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--acc);letter-spacing:1.2px;border-right:1px solid var(--border);padding-right:12px;white-space:nowrap}
.srch{position:relative;flex:0 0 200px}
.srch svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
#search{width:100%;padding:5px 8px 5px 28px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--f-mono);font-size:11px;outline:none;transition:border-color .15s}
#search:focus{border-color:var(--acc)}
#search::placeholder{color:var(--muted)}
.filters{display:flex;gap:3px;overflow-x:auto}
.filters::-webkit-scrollbar{display:none}
.fb{font-family:var(--f-mono);font-size:10px;padding:4px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.4px}
.fb:hover{border-color:var(--border-hi);color:var(--text)}
.fb.active{background:var(--acc);border-color:var(--acc);color:#fff}
.spacer{flex:1}
#s-status{font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.exp-btn{font-family:var(--f-mono);font-size:10px;padding:5px 11px;border-radius:3px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;letter-spacing:.4px}
.exp-btn:hover{background:var(--acc);color:#fff}

/* ── Layout ── */
#graph{position:fixed;top:var(--ph);left:0;right:0;bottom:0;z-index:1}

/* ── Panel ── */
#panel{position:fixed;top:var(--ph);right:0;bottom:0;width:var(--pw);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .23s cubic-bezier(.4,0,.2,1);z-index:100}
#panel.open{transform:none}
.p-top{padding:14px 14px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.p-cat{font-family:var(--f-mono);font-size:9px;text-transform:uppercase;letter-spacing:.9px;margin-bottom:3px}
.p-title{font-size:15px;font-weight:600;margin-bottom:11px;line-height:1.3}
.close{position:absolute;top:11px;right:11px;background:none;border:none;cursor:pointer;color:var(--muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:14px;transition:all .15s}
.close:hover{background:var(--surface2);color:var(--text)}
.tabs{display:flex;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{font-family:var(--f-mono);font-size:10px;letter-spacing:.5px;padding:7px 10px;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.p-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.pane{display:none;flex:1;overflow-y:auto;padding:14px;flex-direction:column}
.pane.active{display:flex}
.sl{font-family:var(--f-mono);font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:5px}
.st{font-size:12.5px;line-height:1.65;color:var(--text);margin-bottom:13px}
.std-blk{font-family:var(--f-mono);font-size:10px;line-height:1.7;padding:8px 10px;background:var(--surface2);border-left:2px solid var(--green);color:var(--green);margin-bottom:13px}
.tags{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.ptag,.ntag{font-family:var(--f-mono);font-size:10px;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;width:fit-content}
.ptag:hover{border-color:var(--acc);color:var(--acc)}
.ntag:hover{border-color:var(--green);color:var(--green)}
.none-tag{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
/* Prompt pane */
.prompt-box{font-family:var(--f-mono);font-size:10.5px;line-height:1.75;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:11px;white-space:pre-wrap;word-break:break-word;margin-bottom:9px;flex:1}
.copy-btn{width:100%;padding:7px;font-family:var(--f-mono);font-size:10px;letter-spacing:.5px;border:1px solid var(--acc);border-radius:3px;background:transparent;color:var(--acc);cursor:pointer;transition:all .15s}
.copy-btn:hover{background:var(--acc);color:#fff}
.copy-btn.ok{background:var(--green);border-color:var(--green);color:#fff}
/* Notes pane */
#notes-area{width:100%;flex:1;min-height:200px;resize:none;font-family:var(--f-mono);font-size:11px;line-height:1.7;background:var(--surface2);border:1px solid var(--border);border-radius:3px;color:var(--text);padding:10px;outline:none;transition:border-color .15s}
#notes-area:focus{border-color:var(--acc)}
#notes-area::placeholder{color:var(--muted)}
.save-st{font-family:var(--f-mono);font-size:9px;color:var(--muted);text-align:right;margin-top:4px}
</style>
</head>
<body>

<header>
  <div class="logo">SE NAVIGATOR</div>
  <div class="srch">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="Search nodes...">
  </div>
  <div class="filters">
    <button class="fb active" data-g="all">ALL</button>
    <button class="fb" data-g="discovery">DISCOVERY</button>
    <button class="fb" data-g="planning">PLANNING</button>
    <button class="fb" data-g="design">DESIGN</button>
    <button class="fb" data-g="build">BUILD</button>
    <button class="fb" data-g="testing">TESTING</button>
    <button class="fb" data-g="delivery">DELIVERY</button>
  </div>
  <div class="spacer"></div>
  <span id="s-status"></span>
  <button class="exp-btn" id="exp">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    EXPORT JSON
  </button>
</header>

<div id="graph"></div>

<aside id="panel">
  <div class="p-top">
    <div id="p-cat" class="p-cat"></div>
    <div id="p-title" class="p-title"></div>
    <button class="close" id="cls">✕</button>
  </div>
  <nav class="tabs">
    <button class="tab active" data-t="overview">OVERVIEW</button>
    <button class="tab" data-t="prompt">PROMPT</button>
    <button class="tab" data-t="notes">NOTES</button>
  </nav>
  <div class="p-body">
    <div class="pane active" id="pane-overview">
      <div class="sl">Purpose</div><div class="st" id="p-desc"></div>
      <div class="sl">Example</div><div class="st" id="p-ex"></div>
      <div class="sl">Standards</div><div class="std-blk" id="p-std"></div>
      <div class="sl">Prerequisites</div><div class="tags" id="p-pre"></div>
      <div class="sl">Next Steps</div><div class="tags" id="p-nxt"></div>
    </div>
    <div class="pane" id="pane-prompt">
      <div class="sl">LLM / Agent Prompt — Copy & Use</div>
      <div class="prompt-box" id="p-prompt"></div>
      <button class="copy-btn" id="copy-btn">COPY PROMPT</button>
    </div>
    <div class="pane" id="pane-notes">
      <div class="sl">Notes (auto-saved locally)</div>
      <textarea id="notes-area" placeholder="Decisions, observations, context for this phase..."></textarea>
      <div class="save-st" id="save-st">—</div>
    </div>
  </div>
</aside>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script>
const GC={
  discovery:{bg:'#eff6ff',bd:'#bfdbfe',hi:'#3b82f6',fn:'#1e3a8a'},
  planning: {bg:'#f5f3ff',bd:'#ddd6fe',hi:'#8b5cf6',fn:'#4c1d95'},
  design:   {bg:'#fdf4ff',bd:'#f5d0fe',hi:'#d946ef',fn:'#701a75'},
  build:    {bg:'#f0f9ff',bd:'#bae6fd',hi:'#0ea5e9',fn:'#0c4a6e'},
  testing:  {bg:'#f0fdf4',bd:'#bbf7d0',hi:'#22c55e',fn:'#14532d'},
  delivery: {bg:'#f0fdfa',bd:'#ccfbf1',hi:'#14b8a6',fn:'#134e4a'},
};
const GM={
  discovery:['problem','need','goal','impact','resources','policies'],
  planning: ['objectives','risk','metrics','gate1','requirements','gate2'],
  design:   ['sysdesign','architecture','moddesign'],
  build:    ['implementation'],
  testing:  ['unittest','inttest','systest','gate3','accepttest','gate4'],
  delivery: ['deployment','operations']
};

const D={
problem:{label:'Problem(s)',g:'discovery',x:-360,y:-330,sh:'box',cat:'Customer · Discovery',
  desc:'A validated gap between current and desired state. The entry point. Must be evidence-based — not assumed.',
  ex:'68% of users abandon checkout. Session recordings confirm a 5-step form is the primary cause.',
  std:'INCOSE SE Handbook §4.1 — Problem/Opportunity Space\nISO/IEC/IEEE 15288:2023 §6.4.1 — Stakeholder Needs Definition',
  pre:[],nxt:['need'],
  prompt:`PHASE: Problem Definition
ROLE: Systems Engineer — Discovery

PREREQUISITES: None (entry point)

TASK:
Investigate and validate the problem space.
Do NOT jump to solutions.

STEPS:
1. Observe current state (data, recordings, interviews)
2. Define desired state (what stakeholders actually want)
3. Quantify the gap (magnitude, frequency, population affected)
4. Validate with ≥3 independent evidence sources

DELIVERABLE — Problem Statement:
  Current state: [describe with data]
  Desired state: [describe clearly]
  The gap:       [quantified — e.g. "68% abandon rate"]
  Evidence:      [source 1], [source 2], [source 3]

QUALITY CHECKS:
□ Evidence-based, not assumption-based
□ Gap is measurable (before/after comparison possible)
□ At least 3 stakeholders confirm the problem exists

NEXT → Need(s)`},

need:{label:'Need(s)',g:'discovery',x:-360,y:-220,sh:'box',cat:'Customer · Discovery',
  desc:'What stakeholders require to resolve the problem. Needs are functional or emotional — never solutions. Derived via interviews, observation, and usage data.',
  ex:'Users need to complete checkout in under 60 seconds without creating an account.',
  std:'ISO/IEC/IEEE 29148:2018 §5.2 — Stakeholder Needs\nINCOSE SE Handbook §4.2 — Needs Analysis',
  pre:['problem'],nxt:['goal'],
  prompt:`PHASE: Needs Analysis
ROLE: Systems Engineer — Stakeholder Liaison

PREREQUISITES:
✓ Problem Statement (validated, evidence-based)

TASK:
Elicit what stakeholders need — not solutions.
Use Jobs-to-be-Done: "When [situation], I need [capability] so that [outcome]."

STEPS:
1. Conduct structured interviews (≥5 stakeholders)
2. Separate needs from solutions in transcript
3. Classify: Functional / Non-Functional / Emotional
4. Rank by stakeholder priority

DELIVERABLE — Needs Register:
  ID    | Statement                          | Priority | Source
  N-001 | [stakeholder] needs to [action]... | Critical | interview/observation

QUALITY CHECKS:
□ No solution language in any need statement
□ Every need traces to the Problem Statement
□ Needs ranked by stakeholder priority

NEXT → Goal`},

goal:{label:'Goal',g:'discovery',x:-360,y:-110,sh:'box',cat:'Customer · Discovery',
  desc:'A directional statement of intent aligning needs to desired outcomes. Goals are not yet measurable — that comes at Metrics.',
  ex:'Improve checkout experience to increase purchase conversion rate.',
  std:'INCOSE SE Handbook §4.2\nISO/IEC 15288 §6.4.1',
  pre:['need'],nxt:['impact','objectives'],
  prompt:`PHASE: Goal Synthesis
ROLE: Systems Engineer — Strategist

PREREQUISITES:
✓ Validated Needs Register

TASK:
Synthesise needs into directional goals.
Format: "[Verb] [subject] to [achieve outcome]"
Example: "Reduce checkout friction to increase completed purchases"

STEPS:
1. Group related needs into themes
2. Write one goal per theme (2–5 goals typical)
3. Confirm each goal addresses ≥1 need
4. Check goals are non-conflicting

DELIVERABLE — Goal Set:
  G-001: [Goal statement] → addresses [N-001, N-002]
  G-002: [Goal statement] → addresses [N-003]

QUALITY CHECKS:
□ No solution language in any goal
□ Goals are directional, not yet measurable
□ All high-priority needs addressed by ≥1 goal

NEXT → Impact, then Objectives`},

impact:{label:'Impact',g:'discovery',x:-360,y:0,sh:'box',cat:'Customer · Discovery',
  desc:'Expected change in system or business state if goals are achieved. Grounds the project in real value, not just feature delivery.',
  ex:'+20% completed purchases. Cart abandonment from 68% → 45%.',
  std:'INCOSE Value Engineering\nISO/IEC 25010 — Quality in Use characteristics',
  pre:['goal'],nxt:['objectives'],
  prompt:`PHASE: Impact Assessment
ROLE: Systems Engineer — Value Analyst

PREREQUISITES:
✓ Goals defined

TASK:
Define the expected impact if goals are achieved.
This becomes the benchmark for project success.

IMPACT TYPES:
• Business:    revenue, cost, efficiency, risk reduction
• User:        time saved, errors reduced, satisfaction
• Technical:   performance, reliability, security
• Strategic:   market position, compliance, capability

DELIVERABLE — Impact Map:
  Goal G-001 → Impact: [quantified change expected]
  Measurement: [how impact will be verified post-delivery]
  Timeframe:   [when impact becomes visible]

QUALITY CHECKS:
□ Every impact is quantified (%, time, money, count)
□ Measurement method is defined before project starts
□ Timeframe is realistic and agreed with stakeholders

NEXT → Objectives`},

resources:{label:'Resources',g:'discovery',x:360,y:-260,sh:'box',cat:'Business · Constraint',
  desc:'Budget, people, tools, and time available. Sets the feasibility boundary before objectives are locked. Unvalidated resources make objectives fictional.',
  ex:'2 developers, 3-month runway, $40K budget, existing AWS infrastructure.',
  std:'ISO 15288 §6.4.3 — Organisational Enabling Infrastructure\nINCOSE §5.1 — Feasibility Analysis',
  pre:[],nxt:['objectives'],
  prompt:`PHASE: Resource Assessment
ROLE: Engineering Manager / Business Analyst

PREREQUISITES: None (run in parallel with Customer Discovery)

TASK:
Catalogue all available resources and constraints
that will shape what Objectives are feasible.

RESOURCE CATEGORIES:
• Human:         [# people, roles, availability %]
• Financial:     [total budget, burn rate, contingency %]
• Time:          [deadline, key milestones]
• Technical:     [existing systems, infrastructure, licences]
• Organisational:[departments, decision authority]

DELIVERABLE — Resource Register:
  Type     | Available    | Constraint        | Notes
  Human    | 2 devs       | 60% availability  | Shared with existing product
  Budget   | $40K         | Fixed, no flex    | Approved by CFO
  Time     | 12 weeks     | Hard deadline     | Contractual

QUALITY CHECKS:
□ All resources confirmed by authorised stakeholders
□ Constraints are hard limits, not preferences
□ Resource gaps identified and flagged before Gate 1

NEXT → Objectives`},

policies:{label:'Policies',g:'discovery',x:360,y:-130,sh:'box',cat:'Business · Constraint',
  desc:'Legal, regulatory, ethical, and organisational rules that constrain the solution space. Must be identified before any design begins.',
  ex:'GDPR compliance required. No raw card data storage (PCI-DSS). Internal API-first mandate.',
  std:'ISO 15288 §6.4.2 — Enterprise Environment\nISO/IEC 27001 — Information Security Management',
  pre:[],nxt:['objectives'],
  prompt:`PHASE: Policy & Constraint Mapping
ROLE: Compliance Analyst / Systems Engineer

PREREQUISITES: None (run in parallel with Customer Discovery)

TASK:
Identify all non-negotiable constraints on the solution.
These bound the entire design space.

CONSTRAINT TYPES:
• Legal:          applicable laws and liability obligations
• Regulatory:     standards with compliance obligations
• Security:       data handling, access control, encryption
• Organisational: internal mandates, approval processes
• Ethical:        data use, fairness, environmental

DELIVERABLE — Policy Register:
  ID    | Type         | Policy               | Impact on Design
  P-001 | Regulatory   | PCI-DSS SAQ-A        | No raw card data on servers
  P-002 | Legal        | GDPR Article 17      | EU-only data storage
  P-003 | Org mandate  | API-first policy     | All features via REST API

QUALITY CHECKS:
□ Each policy has an authoritative source cited
□ Design impact is explicitly stated per policy
□ Legal/compliance team has reviewed the register

NEXT → Objectives`},

objectives:{label:'Objectives',g:'planning',x:0,y:80,sh:'box',cat:'Convergence · Planning',
  desc:'Where customer needs and business constraints converge into specific, agreed intent. Must be SMART. Bridge between discovery and engineering.',
  ex:'Reduce checkout steps 5→2 by end of Q3, within $40K, PCI-DSS compliant.',
  std:'INCOSE SE Handbook §4.3 — Objective Definition\nISO 15288 §6.4.1 — Mission Analysis',
  pre:['impact','goal','resources','policies'],nxt:['risk'],
  prompt:`PHASE: Objective Formulation
ROLE: Systems Engineer — Mission Analyst

PREREQUISITES:
✓ Problem Statement validated
✓ Goals and Impact defined
✓ Resources Register completed
✓ Policy Register completed

TASK:
Synthesise all discovery inputs into SMART objectives.
These become the formal project commitment.

SMART FORMAT:
• Specific:    exact outcome, no ambiguity
• Measurable:  quantified target value
• Achievable:  within resource constraints
• Relevant:    traces to ≥1 Goal
• Time-bound:  clear deadline

DELIVERABLE — Objectives Statement:
  OBJ-001: [SMART statement]
            Traces to: [G-001]
            Constrained by: [P-001, P-002, Budget $40K]
            Success metric: [from Impact Map]

QUALITY CHECKS:
□ Every objective is SMART
□ Every Goal has ≥1 Objective
□ Every Resource/Policy constraint is reflected
□ No conflicts between objectives

NEXT → Risk Assessment`},

risk:{label:'Risk Assessment',g:'planning',x:0,y:200,sh:'box',cat:'Governance · Planning',
  desc:'Identify, analyse, and prioritise threats to objectives before design begins. Assessed by probability × impact. High risks require mitigation plans.',
  ex:'Risk: payment gateway latency >2s (P=M, I=H, Score=6). Mitigation: SLA <200ms + exponential retry.',
  std:'ISO 31000:2018 — Risk Management Principles\nINCOSE SE Handbook §5.7 — Risk Management Process',
  pre:['objectives'],nxt:['metrics'],
  prompt:`PHASE: Risk Assessment
ROLE: Systems Engineer — Risk Manager

PREREQUISITES:
✓ Objectives (SMART, agreed)

TASK:
Identify and quantify all risks that could prevent
objectives from being met. Before any design begins.

SCORING:
  High=3  Medium=2  Low=1
  Score = Probability × Impact (max 9)
  ≥6 → CRITICAL → mandatory mitigation plan
  3–5 → MEDIUM → monitor actively
  <3  → LOW → accept and log

RISK CATEGORIES:
• Technical:   unknowns, integration complexity
• Resource:    availability, skill gaps, budget overrun
• Schedule:    dependencies, external blockers
• Compliance:  regulatory change, audit failure
• Operational: performance, availability, security

DELIVERABLE — Risk Register:
  ID    | Risk              | P | I | Score | Mitigation        | Owner
  R-001 | Gateway latency   | M | H |   6   | SLA + retry logic | CTO
  R-002 | PCI audit failure | L | H |   3   | Pre-audit review  | Lead Eng

QUALITY CHECKS:
□ All objectives have associated risks assessed
□ All score ≥6 items have documented mitigation plans
□ Risk owners assigned for Medium+ risks

NEXT → Metrics / Success Criteria`},

metrics:{label:'Metrics /\nSuccess Criteria',g:'planning',x:0,y:340,sh:'box',cat:'Governance · Planning',
  desc:'Converts objectives into measurable, testable conditions. Every requirement must trace to a metric. Without metrics, acceptance is subjective.',
  ex:'Checkout ≤60s. Abandonment ≤45%. Uptime ≥99.9%. Zero P1 security incidents at launch.',
  std:'ISO/IEC 25010 — Quality Model Metrics\nISO/IEC 29148:2018 §5.4\nINCOSE §4.4',
  pre:['objectives','risk'],nxt:['gate1'],
  prompt:`PHASE: Metrics & Success Criteria
ROLE: Systems Engineer — Quality Analyst

PREREQUISITES:
✓ Objectives (SMART)
✓ Risk Register (mitigations accepted)

TASK:
Convert each objective into quantified, testable
success criteria. These will drive Acceptance Testing.

METRIC FORMAT:
  M-001 → OBJ-001
  Metric:            [what is measured]
  Target:            [threshold — ≤ or ≥]
  Measurement method:[how it is measured]
  Measured at:       [test event or milestone]

METRIC CATEGORIES:
• Functional:    does it do what it should?
• Performance:   speed, throughput, reliability
• Security:      compliance, vulnerability counts
• Usability:     task time, error rate, NPS
• Business:      conversion, retention, revenue

DELIVERABLE — Metrics Traceability Matrix:
  [Objective] → [Metric] → [Test method] → [Pass threshold]

QUALITY CHECKS:
□ Every objective has ≥1 metric
□ Every metric has a clear measurement method
□ All metrics agreed with stakeholders before Gate 1

NEXT → Gate 1: Stakeholder Sign-off`},

gate1:{label:'Gate 1\nSign-off',g:'planning',x:0,y:480,sh:'diamond',cat:'Decision Gate',
  desc:'Formal checkpoint: validate Objectives, Risks, and Metrics before engineering begins. Reject path loops back to revise Objectives.',
  ex:'Product owner + engineering lead sign checklist. Risk register accepted. Scope agreed in writing.',
  std:'ISO 15288 §6.3 — Decision Gates\nINCOSE SE Handbook §3.3 — Technical Reviews and Audits',
  pre:['metrics','risk','objectives'],nxt:['requirements'],
  prompt:`PHASE: Gate 1 — Stakeholder Sign-off
ROLE: Project Lead / Systems Engineer

PREREQUISITES:
✓ Objectives (SMART, agreed by all stakeholders)
✓ Risk Register (reviewed, mitigations accepted)
✓ Metrics / Success Criteria (measurable, agreed)

GATE CHECKLIST:
□ Problem Statement validated and signed off
□ All Objectives are SMART and stakeholder-approved
□ Risk Register reviewed; no unacceptable critical risks remain open
□ Success Criteria are measurable and agreed upon
□ Resource constraints confirmed (budget, team, timeline)
□ Policy Register reviewed by compliance/legal
□ Scope boundary documented — IN and OUT of scope explicit

DECISION:
PASS   → proceed to Requirements Definition
REJECT → return to Objectives with documented objections

DELIVERABLE — Signed Gate 1 Checklist:
  Approver names and roles
  Date of approval
  Any conditions, caveats, or scope exceptions documented

QUALITY CHECKS:
□ All required approvers have signed
□ No open critical risks without accepted mitigations
□ Scope is unambiguous and version-controlled

NEXT → Requirements (PASS) | Objectives (REJECT)`},

requirements:{label:'Requirements',g:'planning',x:0,y:620,sh:'box',cat:'Definition · Planning',
  desc:'Precise, verifiable statements of what the system must do (functional) and how it must perform (non-functional). Each traces to an objective.',

  prompt:`PHASE: Requirements Definition
ROLE: Systems Engineer — Requirements Analyst

PREREQUISITES:
✓ Gate 1 signed off
✓ Objectives, Metrics, Risk Register (approved baseline)

TASK:
Write precise, verifiable requirements. If you cannot
write a test for it, it is NOT a requirement.

TYPES:
• Functional (FR):   "The system SHALL [do X] when [condition]"
• Non-Functional (NFR): performance, security, reliability, usability
• Interface (IR):    APIs, protocols, data formats
• Constraint (CR):   regulatory, physical, technical limits

FORMAT (IEEE 29148):
  ID:                FR-001
  Statement:         The system SHALL process payment within ≤2s
                     under load of 1,000 concurrent users.
  Rationale:         Supports NFR latency target M-002
  Traces to:         OBJ-001, M-002
  Priority:          Must / Should / Could
  Acceptance criterion: Load test ST-001 passes at 1,000 concurrent users

INCOSE QUALITY CRITERIA:
□ Necessary   — removes a risk or satisfies an objective
□ Verifiable  — testable by inspection, analysis, demo, or test
□ Unambiguous — one interpretation only
□ Consistent  — no conflicts with other requirements
□ Complete    — all conditions specified

NEXT → Gate 2: Requirements Review`},

// ── Build vis nodes ──────────────────────────────────────────────────────────
const IDs = Object.keys(D);

function mkNodes(){
  return IDs.map(id=>{
    const d=D[id],c=GC[d.g];
    return{id,label:d.label,x:d.x,y:d.y,fixed:true,shape:d.sh||'box',
      color:{background:c.bg,border:c.bd,highlight:{background:c.bg,border:c.hi},hover:{background:c.bg,border:c.hi}},
      font:{color:c.fn,size:11,face:'JetBrains Mono',multi:false},
      borderWidth:1,borderWidthSelected:2,margin:10,
      widthConstraint:{minimum:d.sh==='diamond'?80:110,maximum:d.sh==='diamond'?100:140}};
  });
}

function mkEdges(){
  const es=[];
  const S={arrows:{to:{enabled:true,scaleFactor:0.5}},smooth:{type:'curvedCW',roundness:0.05},color:{color:'#94a3b8',highlight:'#2563eb',hover:'#2563eb'}};
  const R={...S,dashes:true,color:{color:'#f87171',highlight:'#dc2626',hover:'#dc2626'},font:{size:8,color:'#991b1b',face:'JetBrains Mono',align:'top'}};
  const B={...S,dashes:true,color:{color:'#cbd5e1',highlight:'#2563eb',hover:'#2563eb'},font:{size:8,color:'#1e40af',face:'JetBrains Mono',align:'middle'}};
  const A={...S,dashes:true,color:{color:'#fbbf24',highlight:'#d97706',hover:'#d97706'},font:{size:8,color:'#92400e',face:'JetBrains Mono',align:'middle'}};

  const flow=[['problem','need'],['need','goal'],['goal','impact'],
    ['impact','objectives'],['goal','objectives'],
    ['resources','objectives'],['policies','objectives'],
    ['objectives','risk'],['risk','metrics'],['metrics','gate1'],
    ['gate1','requirements'],['requirements','gate2'],
    ['gate2','sysdesign'],['sysdesign','architecture'],['architecture','moddesign'],
    ['moddesign','implementation'],['implementation','unittest'],
    ['unittest','inttest'],['inttest','systest'],['systest','gate3'],
    ['gate3','accepttest'],['accepttest','gate4'],
    ['gate4','deployment'],['deployment','operations']];
  flow.forEach(([f,t])=>es.push({from:f,to:t,...S}));
  es.push({from:'gate1',to:'objectives',label:'reject',...R});
  es.push({from:'gate2',to:'requirements',label:'reject',...R});
  es.push({from:'gate3',to:'requirements',label:'fail',...R});
  es.push({from:'gate4',to:'objectives',label:'reject',...R});
  es.push({from:'requirements',to:'accepttest',label:'validates',...B});
  es.push({from:'sysdesign',to:'systest',label:'validates',...B});
  es.push({from:'architecture',to:'inttest',label:'validates',...B});
  es.push({from:'moddesign',to:'unittest',label:'validates',...B});
  es.push({from:'operations',to:'problem',label:'new problems',...A});
  return es;
}

const network = new vis.Network(
  document.getElementById('graph'),
  {nodes:new vis.DataSet(mkNodes()),edges:new vis.DataSet(mkEdges())},
  {physics:false,
   nodes:{shapeProperties:{borderRadius:4}},
   edges:{selectionWidth:1.5},
   interaction:{hover:true,zoomView:true,dragView:true,tooltipDelay:150},
   layout:{randomSeed:1}}
);
network.fit({animation:{duration:900,easingFunction:'easeInOutQuad'}});

function openPanel(id){
  const d=D[id]; if(!d)return;
  cur=id;
  const c=GC[d.g];
  document.getElementById('p-cat').textContent=d.cat;
  document.getElementById('p-cat').style.color=c.hi;
  document.getElementById('p-title').textContent=d.label.replace('\n',' ');
  document.getElementById('p-desc').textContent=d.desc;
  document.getElementById('p-ex').innerHTML=d.ex.replace(/\n/g,'<br>');
  document.getElementById('p-std').innerHTML=d.std.replace(/\n/g,'<br>');
  const preEl=document.getElementById('p-pre');
  preEl.innerHTML=d.pre.length?d.pre.map(p=>`<span class="ptag" data-n="${p}">← ${D[p].label.replace('\n',' ')}</span>`).join(''):`<span class="none-tag">Entry point — no prerequisites</span>`;
  const nxtEl=document.getElementById('p-nxt');
  nxtEl.innerHTML=d.nxt.length?d.nxt.map(n=>`<span class="ntag" data-n="${n}">→ ${D[n].label.replace('\n',' ')}</span>`).join(''):`<span class="none-tag">Terminal node</span>`;
  document.getElementById('p-prompt').textContent=d.prompt;
  const saved=localStorage.getItem('sen_'+id)||'';
  document.getElementById('notes-area').value=saved;
  document.getElementById('save-st').textContent=saved?'Saved ✓':'—';
  panel.classList.add('open');
  setTab('overview');
}

function closePanel(){panel.classList.remove('open');cur=null;}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.t));
function setTab(n){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.t===n));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+n));
}

document.getElementById('p-pre').addEventListener('click',e=>{const n=e.target.dataset.n;if(n){openPanel(n);network.selectNodes([n]);}});
document.getElementById('p-nxt').addEventListener('click',e=>{const n=e.target.dataset.n;if(n){openPanel(n);network.selectNodes([n]);}});

document.getElementById('copy-btn').onclick=function(){
  navigator.clipboard.writeText(D[cur]?.prompt||'').then(()=>{
    this.textContent='COPIED ✓';this.classList.add('ok');
    setTimeout(()=>{this.textContent='COPY PROMPT';this.classList.remove('ok');},1800);
  });
};

document.getElementById('notes-area').addEventListener('input',function(){
  document.getElementById('save-st').textContent='Saving...';
  clearTimeout(notesT);
  notesT=setTimeout(()=>{
    if(cur){localStorage.setItem('sen_'+cur,this.value);document.getElementById('save-st').textContent='Saved ✓';}
  },500);
});

document.getElementById('cls').onclick=closePanel;
network.on('click',p=>{if(p.nodes.length)openPanel(p.nodes[0]);});
network.on('hoverNode',()=>document.getElementById('graph').style.cursor='pointer');
network.on('blurNode',()=>document.getElementById('graph').style.cursor='default');

// ── Search ───────────────────────────────────────────────────────────────────
function resetVis(){
  network.body.data.nodes.update(IDs.map(id=>{const d=D[id],c=GC[d.g];return{id,color:{background:c.bg,border:c.bd,highlight:{background:c.bg,border:c.hi},hover:{background:c.bg,border:c.hi}},font:{color:c.fn,size:11,face:'JetBrains Mono'}};}));
}
document.getElementById('search').addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  const ss=document.getElementById('s-status');
  if(!q){resetVis();ss.textContent='';return;}
  const hits=IDs.filter(id=>{const d=D[id];return d.label.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.cat.toLowerCase().includes(q)||d.ex.toLowerCase().includes(q);});
  network.body.data.nodes.update(IDs.map(id=>{
    const d=D[id],c=GC[d.g],on=hits.includes(id);
  return{id,color:{background:on?c.bg:'#f8fafc',border:on?c.hi:'#e2e8f0',highlight:{background:c.bg,border:c.hi}},font:{color:on?c.fn:'#cbd5e1',size:11,face:'JetBrains Mono'}};
  }));
  ss.textContent=hits.length?`${hits.length} result${hits.length>1?'s':''}`:' no match';
  if(hits.length===1)network.focus(hits[0],{scale:1.3,animation:{duration:400,easingFunction:'easeInOutQuad'}});
  else if(hits.length>1)network.fit({nodes:hits,animation:{duration:400,easingFunction:'easeInOutQuad'}});
});

// ── Filter ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.fb').forEach(btn=>btn.onclick=function(){
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  this.classList.add('active');
  document.getElementById('search').value='';
  document.getElementById('s-status').textContent='';
  const g=this.dataset.g;
  if(g==='all'){resetVis();network.fit({animation:{duration:500,easingFunction:'easeInOutQuad'}});return;}
  const active=GM[g]||[];
  network.body.data.nodes.update(IDs.map(id=>{
    const d=D[id],c=GC[d.g],on=active.includes(id);
  return{id,color:{background:on?c.bg:'#f8fafc',border:on?c.hi:'#e2e8f0',highlight:{background:c.bg,border:c.hi}},font:{color:on?c.fn:'#cbd5e1',size:11,face:'JetBrains Mono'}};
  }));
  network.fit({nodes:active,animation:{duration:500,easingFunction:'easeInOutQuad'}});
});

// ── Export ───────────────────────────────────────────────────────────────────
document.getElementById('exp').onclick=()=>{
  const out={framework:'SE Navigator',version:'2.0',exported:new Date().toISOString(),
    nodes:IDs.map(id=>{const d=D[id];return{id,label:d.label.replace('\n',' '),category:d.cat,group:d.g,description:d.desc,example:d.ex,standards:d.std,prerequisites:d.pre,nextSteps:d.nxt,prompt:d.prompt,notes:localStorage.getItem('sen_'+id)||''};})};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download='se-framework-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
};
</script>
</body>
</html>
